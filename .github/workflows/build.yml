name: build

on:
  schedule:
    - cron: "30 2 * * *"   # UTC 02:30 = 北京 10:30，晚于多数上游的日更时间
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "build/**"
      - "src/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析器自测
        run: python build/build.py --selftest

      - name: 构建规则产物
        run: python build/build.py

      - name: 提交产物（无变化则跳过）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "build: rules snapshot $(date -u +%Y%m%d)"
            git push
          fi
